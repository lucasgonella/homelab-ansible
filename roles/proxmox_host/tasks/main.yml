---
- name: Validar que o host e Proxmox VE
  ansible.builtin.command:
    cmd: pveversion
  register: proxmox_version
  changed_when: false

- name: Exibir versao do Proxmox
  ansible.builtin.debug:
    var: proxmox_version.stdout

- name: Garantir pacotes administrativos
  ansible.builtin.apt:
    name:
      - curl
      - jq
      - rsync
      - zabbix-agent2
    state: present

- name: Configurar servidor Zabbix
  ansible.builtin.lineinfile:
    path: /etc/zabbix/zabbix_agent2.conf
    regexp: '^Server='
    line: "Server={{ proxmox_zabbix_server }}"
  notify: Restart Zabbix Agent 2

- name: Configurar active checks do Zabbix
  ansible.builtin.lineinfile:
    path: /etc/zabbix/zabbix_agent2.conf
    regexp: '^ServerActive='
    line: "ServerActive={{ proxmox_zabbix_server }}"
  notify: Restart Zabbix Agent 2

- name: Configurar hostname do Zabbix Agent
  ansible.builtin.lineinfile:
    path: /etc/zabbix/zabbix_agent2.conf
    regexp: '^Hostname='
    line: "Hostname={{ inventory_hostname }}"
  notify: Restart Zabbix Agent 2

- name: Garantir Zabbix Agent 2 ativo
  ansible.builtin.service:
    name: zabbix-agent2
    state: started
    enabled: true

- name: Instalar script de backup da configuracao do Proxmox
  ansible.builtin.template:
    src: backup-pve01-config.sh.j2
    dest: /usr/local/sbin/backup-pve01-config.sh
    owner: root
    group: root
    mode: '0700'

- name: Instalar systemd service do backup do Proxmox
  ansible.builtin.copy:
    src: pve01-config-backup.service
    dest: /etc/systemd/system/pve01-config-backup.service
    owner: root
    group: root
    mode: '0644'

- name: Instalar systemd timer do backup do Proxmox
  ansible.builtin.template:
    src: pve01-config-backup.timer.j2
    dest: /etc/systemd/system/pve01-config-backup.timer
    owner: root
    group: root
    mode: '0644'
  notify: Restart Proxmox backup timer

- name: Garantir timer de backup do Proxmox habilitado
  ansible.builtin.systemd:
    name: pve01-config-backup.timer
    enabled: true
    state: started
    daemon_reload: true
