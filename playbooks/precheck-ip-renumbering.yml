---
- name: Pre-check - Homelab IP renumbering
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Testar se os novos IPs respondem
      ansible.builtin.command:
        cmd: "ping -c 1 -W 1 {{ item.value.new_ip }}"
      loop: "{{ homelab_ip_plan | dict2items }}"
      loop_control:
        label: "{{ item.key }} -> {{ item.value.new_ip }}"
      when: item.value.current_ip != item.value.new_ip
      register: ip_checks
      changed_when: false
      failed_when: false

    - name: Garantir que os novos IPs estão livres
      ansible.builtin.assert:
        that:
          - item.rc != 0
        fail_msg: >-
          ERRO: {{ item.item.value.new_ip }} destinado ao host
          {{ item.item.key }} já está respondendo na rede.
        success_msg: >-
          OK: {{ item.item.value.new_ip }} destinado ao host
          {{ item.item.key }} aparenta estar livre.
      loop: "{{ ip_checks.results }}"
      loop_control:
        label: "{{ item.item.key }} -> {{ item.item.value.new_ip }}"
      when:
        - item.item is defined
        - item.item.value.current_ip != item.item.value.new_ip
